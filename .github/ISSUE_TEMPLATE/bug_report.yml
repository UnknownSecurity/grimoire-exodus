name: Bug report
description: Report a reproducible problem in Grimoire Exodus
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include passwords, tokens, account-vault contents, or other private data.
  - type: dropdown
    id: version
    attributes:
      label: Version
      options:
        - 1.1.0
        - Latest main branch
        - Other
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Official MSI installer
        - Official portable ZIP
        - Built from source
        - Other
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and when it occurs.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove usernames, credentials, tokens, and other private information first.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I downloaded Grimoire Exodus from this repository or built it from source.
          required: true
        - label: I searched existing issues for this problem.
          required: true
        - label: This report does not contain passwords, tokens, or account-vault data.
          required: true
